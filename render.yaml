services:
  - type: web
    name: smart-farm-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build:cloud
    startCommand: npm run start:cloud
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:8080,http://127.0.0.1:8080
      - key: SESSION_HOURS
        value: "8"
